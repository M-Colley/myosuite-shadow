[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "myosuite-shadow"
dynamic = ["version"]
description = "Live muscle activation and fatigue estimates beside an experiment, built on MyoSuite"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mark Colley" }]
keywords = ["musculoskeletal", "static optimization", "fatigue", "MuJoCo", "MyoSuite", "user studies"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "mujoco>=3.3,<4",
  # The study-support APIs require this published MyoSuite source revision.
  # Replace the Git pin with a released version once those APIs ship.
  "myosuite @ git+https://github.com/MyoHub/myosuite.git@87c1896b12b99683aecc83d6aab00cc66243a50f",
]

[project.optional-dependencies]
# Tracker keypoints -> model poses (myosuite_shadow.ik).
ik = ["mink>=1.0"]
# LabStreamingLayer outlets (myosuite_shadow.lsl).
lsl = ["pylsl>=1.16"]
# XDF import and agreement statistics (myosuite_shadow.validation).
validation = ["pyxdf>=1.16", "pingouin>=0.5.4", "pandas>=2"]
all = ["myosuite-shadow[ik,lsl,validation]"]
test = ["pytest>=8", "ruff==0.4.4", "myosuite-shadow[ik,lsl,validation]"]

[project.urls]
Homepage = "https://github.com/M-Colley/myosuite-shadow"
Repository = "https://github.com/M-Colley/myosuite-shadow"
Issues = "https://github.com/M-Colley/myosuite-shadow/issues"

[project.scripts]
myosuite-shadow = "myosuite_shadow.cli:main"
myosuite-shadow-track = "myosuite_shadow.track_cli:main"
myosuite-shadow-validate = "myosuite_shadow.study:main"
myosuite-shadow-preflight = "myosuite_shadow.preflight:main"

[tool.hatch.version]
path = "src/myosuite_shadow/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/myosuite_shadow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["myosuite_shadow"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/myosuite_shadow/__init__.py" }]
